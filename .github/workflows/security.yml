name: Dependency and provenance inventory
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: security-audit
      - name: Install pinned RustSec auditor
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - name: Check locked dependencies against current advisories
        run: cargo audit --file Cargo.lock --json > audit.json
      - name: Retain audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit.json
          retention-days: 30
