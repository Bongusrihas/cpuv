name: Release Windows executable

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate source and build standalone assets
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo clippy --workspace --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          ./scripts/package.ps1
          $version = (./target/release/cpuv.exe --version).Split(' ')[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag must match the Cargo package version'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: cpuv-windows-release
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cpuv-windows-release
          path: dist
      - name: Publish prebuilt release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check cpuv-setup.exe.sha256 cpuv-x86_64-pc-windows-msvc.zip.sha256)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            notes="docs/release-notes/$RELEASE_TAG.md"
            if [ -f "$notes" ]; then
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "cpuv $RELEASE_TAG" --notes-file "$notes"
            else
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "cpuv $RELEASE_TAG" --generate-notes
            fi
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
