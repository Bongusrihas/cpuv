name: Release Windows executable

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate source and build standalone assets
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Behavioral tests failed' }
          ./scripts/package.ps1
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $releaseBinary = Join-Path $metadata.target_directory 'release/cpuv.exe'
          $version = (& $releaseBinary --version).Split(' ')[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag must match the Cargo package version'
          }
      - uses: msys2/setup-msys2@v2
        id: phase1-msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Complete Phase 1 acceptance gate
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.phase1-msys2.outputs.msys2-location }}
        run: |
          $compiler = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin/g++.exe'
          ./scripts/test-phase1.ps1 -ReleaseBuild -Compiler $compiler -EvidenceDirectory "$env:RUNNER_TEMP/cpuv-phase1-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Phase 1 acceptance gate failed' }
      - name: Retain Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-evidence
          path: ${{ runner.temp }}/cpuv-phase1-evidence
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: cpuv-windows-release
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cpuv-windows-release
          path: dist
      - name: Publish prebuilt release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check cpuv-setup.exe.sha256 cpuv-x86_64-pc-windows-msvc.zip.sha256)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            notes="docs/release-notes/$RELEASE_TAG.md"
            if [ -f "$notes" ]; then
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "cpuv $RELEASE_TAG" --notes-file "$notes"
            else
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "cpuv $RELEASE_TAG" --generate-notes
            fi
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
