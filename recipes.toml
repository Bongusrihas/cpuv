schema = 1

# Published source archives are pinned by SHA-256. Changes require a new lock.
[packages.fmt]
version = "11.1.4"
url = "https://codeload.github.com/fmtlib/fmt/tar.gz/refs/tags/11.1.4"
sha256 = "ac366b7b4c2e9f0dde63a59b3feb5ee59b67974b14ee5dc9ea8ad78aa2c1ee1e"
archive = "tar.gz"
strip_components = 1
minimum_cxx = 11
license_file = "LICENSE"
cmake = ["-DFMT_TEST=OFF", "-DFMT_DOC=OFF", "-DFMT_INSTALL=ON", "-DBUILD_SHARED_LIBS=ON"]
[packages.fmt.interface]
module = "fmt"
libraries = ["fmt"]
cflags = ["-DFMT_SHARED"]

[packages.eigen]
version = "3.4.0"
url = "https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz"
sha256 = "8586084f71f9bde545ee7fa6d00288b264a2b7ac3607b974e54d13e7162c1c72"
archive = "tar.gz"
strip_components = 1
minimum_cxx = 3
license_file = "COPYING.MPL2"
cmake = ["-DBUILD_TESTING=OFF", "-DEIGEN_BUILD_DOC=OFF", "-DEIGEN_BUILD_PKGCONFIG=ON"]

[packages.zlib]
version = "1.3.1"
url = "https://zlib.net/fossils/zlib-1.3.1.tar.gz"
sha256 = "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"
archive = "tar.gz"
strip_components = 1
requires_c = true
license_file = "LICENSE"
cmake = ["-DZLIB_BUILD_EXAMPLES=OFF", "-DBUILD_SHARED_LIBS=ON"]
# GNU windres distributions differ in shell quoting. Keep its resource arguments
# relative to the build directory so cached builds also work beneath spaced paths.
[[packages.zlib.patches]]
file = "CMakeLists.txt"
find = '''    add_custom_command(OUTPUT ${CMAKE_CURRENT_BINARY_DIR}/zlib1rc.obj
                       COMMAND ${CMAKE_RC_COMPILER}
                            -D GCC_WINDRES
                            -I ${CMAKE_CURRENT_SOURCE_DIR}
                            -I ${CMAKE_CURRENT_BINARY_DIR}
                            -o ${CMAKE_CURRENT_BINARY_DIR}/zlib1rc.obj
                            -i ${CMAKE_CURRENT_SOURCE_DIR}/win32/zlib1.rc)'''
replace = '''    file(RELATIVE_PATH ZLIB_RC_SOURCE "${CMAKE_CURRENT_BINARY_DIR}" "${CMAKE_CURRENT_SOURCE_DIR}")
    add_custom_command(OUTPUT ${CMAKE_CURRENT_BINARY_DIR}/zlib1rc.obj
                       COMMAND ${CMAKE_RC_COMPILER}
                            -D GCC_WINDRES
                            -I ${ZLIB_RC_SOURCE}
                            -I .
                            -o zlib1rc.obj
                            -i ${ZLIB_RC_SOURCE}/win32/zlib1.rc
                       WORKING_DIRECTORY ${CMAKE_CURRENT_BINARY_DIR}
                       VERBATIM)'''
[packages.zlib.interface]
module = "zlib"
libraries = ["zlib"]
cflags = ["-DZLIB_DLL"]
[packages.zlib.interface.libraries_by_runtime]
cygwin = ["z"]

[tools.cmake]
version = "3.31.6"
url = "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip"
sha256 = "d163cd3ab4959b0a53fa8988f2ddbd2e6c501658201e6a154386bad9dbe4f836"
archive = "zip"
strip_components = 1
executable = "bin/cmake.exe"
include = ["bin/cmake.exe", "share/cmake-3.31/Modules", "share/cmake-3.31/Templates", "doc/cmake"]
exclude = ["doc/cmake/html"]

[tools.ninja]
version = "1.12.1"
url = "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip"
sha256 = "f550fec705b6d6ff58f2db3c374c2277a37691678d6aba463adcbb129108467a"
archive = "zip"
strip_components = 0
executable = "ninja.exe"
