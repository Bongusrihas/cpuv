[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Bongu srihas"]
repository = "https://github.com/Bongusrihas/cpuv"
homepage = "https://github.com/Bongusrihas/cpuv"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
sha2 = "0.10"
regex = "1"
tar = "0.4"
zstd = "0.13"
flate2 = "1"
tempfile = "3"
fs2 = "0.4"
walkdir = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
futures-util = "0.3"
indicatif = "0.17"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
cpuv-toolchain = { path = "crates/cpuv-toolchain" }
cpuv-solver = { path = "crates/cpuv-solver" }
cpuv-fetch = { path = "crates/cpuv-fetch" }
cpuv-store = { path = "crates/cpuv-store" }
cpuv-relocate = { path = "crates/cpuv-relocate" }
cpuv-shim = { path = "crates/cpuv-shim" }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
